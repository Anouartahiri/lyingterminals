:root{--bg:#002b36;--fg:rgb(165,182,184);--muted:rgb(123,150,156);--line:rgb(26,65,75);--panel:rgb(7,49,60);--red:rgb(235,104,57);--green:rgb(133,153,0);--yellow:rgb(181,137,0);--magenta:rgb(131,137,223);--blue:rgb(131,148,150)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--bg);color:var(--fg)}
h1{position:absolute;top:62px;left:0;right:0;text-align:center;font:400 62px/1 "NR";letter-spacing:-.02em;color:var(--fg)}
h1 i{color:var(--red);font-style:normal}
.win{position:absolute;left:120px;top:166px;width:960px;height:372px;border:1px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:0 30px 70px -30px #000;overflow:hidden}
.bar{height:46px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:10px;font:20px "DM";color:var(--muted)}
.bar b{width:14px;height:14px;border-radius:50%;display:inline-block}
.bar .t{margin-left:auto;margin-right:auto;transform:translateX(-30px)}
.body{position:relative;padding:22px 30px;font:28px/46px "DM"}
.ln{white-space:nowrap}
.lab{display:inline-block;font-size:19px;line-height:1;letter-spacing:.05em;padding:6px 11px;border:2px solid currentColor;border-radius:99px;vertical-align:4px;margin-left:14px}
.grade{position:absolute;right:34px;top:30px;text-align:center;color:var(--red)}
.grade .g{font:400 210px/.8 "NR";letter-spacing:-.05em}
.grade .s{font:22px "DM";color:var(--muted);margin-top:16px}
.wm{position:absolute;bottom:62px;left:0;right:0;text-align:center;font:20px "DM";color:var(--muted);letter-spacing:.04em}
.wm b{color:var(--fg);font-weight:400}
